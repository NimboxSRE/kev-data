name: Actualizar catálogo

on:
  schedule:
    - cron: "17 * * * *" # cada hora
  push:
    branches: [main]
    paths: [additions.json, scripts/build.py, scripts/vulnrichment.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # vulnrichment (SSVC de CISA) cambia unas 3 veces al día: solo se clona
      # (~230 MB) cuando hay un commit nuevo.
      - name: ¿Hay vulnrichment nuevo?
        id: vr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/cisagov/vulnrichment/commits/develop --jq .sha)
          have=$(jq -r '.commit // ""' ssvc.json 2>/dev/null || true)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$have" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: SSVC de vulnrichment
        if: steps.vr.outputs.changed == 'true'
        run: |
          git clone -q --depth 1 --branch develop https://github.com/cisagov/vulnrichment "$RUNNER_TEMP/vr"
          python3 scripts/vulnrichment.py "$RUNNER_TEMP/vr" "$(git -C "$RUNNER_TEMP/vr" rev-parse HEAD)"
      - name: Generar catálogo
        run: python3 scripts/build.py
      - name: Publicar si cambió
        run: |
          if git diff --quiet -- known_exploited_vulnerabilities.json known_exploited_vulnerabilities.csv ssvc.json; then
            echo "sin cambios"; exit 0
          fi
          git config user.name "nimboxsre-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add known_exploited_vulnerabilities.json known_exploited_vulnerabilities.csv ssvc.json
          git commit -m "Catálogo $(jq -r .catalogVersion known_exploited_vulnerabilities.json): $(jq -r .count known_exploited_vulnerabilities.json) entradas · SSVC $(jq -r .count ssvc.json) CVE"
          git push
