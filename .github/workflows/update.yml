name: Actualizar catálogo

on:
  schedule:
    - cron: "17 * * * *" # cada hora
  push:
    branches: [main]
    paths: [additions.json, scripts/build.py, scripts/vulnrichment.py, scripts/poc.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # vulnrichment (SSVC de CISA) cambia unas 3 veces al día: solo se clona
      # (~230 MB) cuando hay un commit nuevo.
      - name: ¿Hay vulnrichment nuevo?
        id: vr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/cisagov/vulnrichment/commits/develop --jq .sha)
          have=$(jq -r '.commit // ""' ssvc.json 2>/dev/null || true)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$have" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: SSVC de vulnrichment
        if: steps.vr.outputs.changed == 'true'
        run: |
          git clone -q --depth 1 --branch develop https://github.com/cisagov/vulnrichment "$RUNNER_TEMP/vr"
          python3 scripts/vulnrichment.py "$RUNNER_TEMP/vr" "$(git -C "$RUNNER_TEMP/vr" rev-parse HEAD)"
      # PoC público en GitHub (nomi-sec). Es una señal más débil que el KEV, así
      # que no va al catálogo: se publica aparte en poc.json. El clon es grande,
      # de modo que solo se reconstruye una vez al día (04 UTC) o a mano.
      - name: ¿Refrescar PoC? (nomi-sec)
        id: poc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/nomi-sec/PoC-in-GitHub/commits/master --jq .sha)
          have=$(jq -r '.commit // ""' poc.json 2>/dev/null || true)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$head" != "$have" ] && { [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%H)" = "04" ]; }; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: PoC de nomi-sec
        if: steps.poc.outputs.changed == 'true'
        run: |
          git clone -q --depth 1 --branch master https://github.com/nomi-sec/PoC-in-GitHub "$RUNNER_TEMP/poc"
          python3 scripts/poc.py "$RUNNER_TEMP/poc" "${{ steps.poc.outputs.head }}"
      - name: Generar catálogo
        run: python3 scripts/build.py
      - name: Publicar si cambió
        run: |
          # Se preparan antes de comprobar: poc.json puede ser nuevo (sin
          # rastrear) y `git diff` solo mira lo rastreado.
          files="known_exploited_vulnerabilities.json known_exploited_vulnerabilities.csv ssvc.json"
          [ -f poc.json ] && files="$files poc.json"
          git add $files
          if git diff --cached --quiet; then
            echo "sin cambios"; exit 0
          fi
          git config user.name "nimboxsre-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Catálogo $(jq -r .catalogVersion known_exploited_vulnerabilities.json): $(jq -r .count known_exploited_vulnerabilities.json) entradas · SSVC $(jq -r .count ssvc.json) CVE · PoC $(jq -r '.count // 0' poc.json 2>/dev/null) CVE"
          git push
