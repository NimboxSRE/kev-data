name: Actualizar catálogo

on:
  schedule:
    - cron: "17 * * * *" # cada hora
  push:
    branches: [main]
    paths: [additions.json, scripts/build.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar
        run: python3 scripts/build.py
      - name: Publicar si cambió
        run: |
          if git diff --quiet -- known_exploited_vulnerabilities.json known_exploited_vulnerabilities.csv; then
            echo "sin cambios"; exit 0
          fi
          git config user.name "nimboxsre-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add known_exploited_vulnerabilities.json known_exploited_vulnerabilities.csv
          git commit -m "Catálogo $(jq -r .catalogVersion known_exploited_vulnerabilities.json): $(jq -r .count known_exploited_vulnerabilities.json) entradas ($(jq -r .counts.NimboxSRE known_exploited_vulnerabilities.json) propias)"
          git push
